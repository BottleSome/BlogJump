<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="origin-when-cross-origin">
    </link>
    <style>
        @font-face {
            font-family: 'FusionPixel';
            src: url('https://cdn.imbottle.com/static_files/fonts/fusion-pixel-12px-monospaced-zh_hans.otf.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --title-color: #f7f7f7;
            --text-color: #f7f7f7;
            --background-color: #323438;
            --font-family: 'FusionPixel', sans-serif;
            --right-column-width: 42%;
            --right-column-min-width: 300px;
            --a-color: #a3c8da;
            --a-hover-color: #f7f7f7;
            --tooltip-background-color: rgb(99 118 138);
            --tooltip-top: 95%;
            --tooltip-top-hover: 101%;
        }

        body {
            margin: 1em;
            background-color: var(--background-color);
        }

        a {
            color: var(--a-color);
            transition: .5s ease;
        }

        a:hover {
            color: var(--a-hover-color);
        }

        p {
            line-height: 1.2rem;
        }

        img {
            border-radius: .2em;
        }

        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-desc);
            line-height: 1.2rem;
            font-family: var(--font-family);
            text-align: center;
            border-radius: .5em;
            position: absolute;
            width: 100%;
            z-index: 10;
            left: 0;
            padding: .5em 0;
            top: calc(var(--tooltip-top) + 14px);
            color: var(--text-color);
            background-color: var(--tooltip-background-color);
            opacity: 0;
            overflow-y: hidden;
            transition: .3s ease;
            pointer-events: none;
        }

        .tooltip::before {
            content: "";
            position: absolute;
            left: 50%;
            top: var(--tooltip-top);
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
            background-color: var(--tooltip-background-color);
            opacity: 0;
            transition: .3s ease;
        }

        .tooltip:hover::after {
            opacity: 1;
            top: calc(var(--tooltip-top-hover) + 14px);
        }

        .tooltip:hover::before {
            opacity: 1;
            top: var(--tooltip-top-hover);
        }

        footer p a {
            color: rgb(134, 134, 134);
            text-decoration: none;
        }

        .container {
            max-width: 870px;
            margin: 0 auto;
        }

        .container .site-title {
            color: var(--title-color);
            font-family: var(--font-family);
            font-size: 1.5rem;
            font-weight: normal;
            margin-top: 1rem;
            margin-bottom: 1.7rem;
        }

        .lang-sel {
            display: inline-block;
            font-size: .9rem;
            margin-left: .2rem;
        }

        .lang-item {
            display: inline-block;
            margin-right: 0.05rem;
        }

        .lang-item a {
            text-decoration: none;
        }

        .lang-active a {
            color: var(--a-hover-color);
        }

        .masked {
            filter: blur(.15rem);
            transition: .3s ease;
        }

        .masked:hover {
            filter: none;
        }

        .markdown-body {
            color: var(--text-color);
        }

        .markdown-body h2 {
            font-family: var(--font-family);
            font-size: 1.3rem;
            font-weight: normal;
            margin-top: .2rem;
            margin-bottom: 1.7rem;
        }

        .markdown-body h2::before {
            content: "▷";
            color: var(--title-color);
            margin-right: .7rem;
        }

        .markdown-body p {
            font-family: var(--font-family);
            margin: 1.5rem 0;
        }

        .markdown-body ul {
            font-family: var(--font-family);
            margin: 1.7rem 0;
            padding-left: 2rem;
        }

        .markdown-body li {
            margin: .7rem 0;
        }

        .markdown-body pre {
            background-color: #2d2d2d;
            padding: 15px 10px;
            border-radius: 5px;
            text-align: center;
            overflow-x: auto;
        }

        /* Introduction Section */

        .introduction {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .introduction .left-column {
            flex: 1;
            margin-right: 20px;
        }

        .introduction .right-column {
            width: var(--right-column-width);
            min-width: var(--right-column-min-width);
            text-align: right;
        }

        .introduction .right-column .img-wrapper {
            display: inline-block;
        }

        .introduction .right-column img {
            max-width: 100%;
            max-height: 350px;
        }

        .markdown-body .quote-text::before {
            content: "⌜";
        }

        .markdown-body .quote-text::after {
            content: "⌟";
        }

        .markdown-body .quote-source {
            text-align: right;
            margin-bottom: 1rem;
        }

        .markdown-body .quote-source::before {
            content: "—— ";
        }

        /* Links Section */

        .links {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }

        .links .left-column {
            flex: 1;
            margin-right: 20px;
        }

        .links .right-column {
            width: var(--right-column-width);
            min-width: var(--right-column-min-width);
            text-align: right;
        }

        .links .right-column img {
            max-width: 100%;
        }

        footer {
            font-family: var(--font-family);
        }

        @media screen and (max-width: 665px) {
            .introduction {
                flex-direction: column-reverse;
            }

            .introduction .left-column {
                margin-right: 0;
                margin-top: 10px;
            }

            .introduction .right-column {
                width: 100%;
                min-width: unset;
                margin-bottom: 15px;
                text-align: center;
            }

            .links {
                flex-direction: column;
                align-items: flex-start;
            }

            .links .left-column {
                margin-right: 0;
            }

            .links .right-column {
                width: 100%;
                min-width: unset;
                margin-top: 15px;
                text-align: center;
            }
        }
    </style>
    <title>些瓶的小站</title>
</head>

<template id="template">
    <div class="site-title" style="color: #f7f7f7;">
        {{ siteTitle }}
        <div class="lang-sel">
            <div class="lang-item lang-active" data-lang="zh">[<a href="javascript:void(0);">中文</a>]</div>
            <div class="lang-item" data-lang="en">[<a href="javascript:void(0);">English</a>]</div>
        </div>
    </div>
    <div class="markdown-body">
        {{ loadingText }}
    </div>
    <footer>
        <p><a href="http://beian.miit.gov.cn" target="_blank">闽ICP备17007528号-3</a></p>
    </footer>
</template>

<body>
    <div class="container"></div>
    <script src='https://cdn.imbottle.com/static_files/markdown/markdown-it.min.js'></script>
    <script>
        const templateMapping = {
            "zh": {
                siteTitle: "些瓶的小站",
                loadingText: "个人介绍拉取中..."
            },
            "en": {
                siteTitle: "Bottle's Site",
                loadingText: "Loading introduction..."
            }
        };
        const readmeCache = {};
        const containerElement = document.querySelector('.container');
        const templateElement = document.getElementById('template');
        let currentLang = '';
        // 切换语言并获取指定语言的 README
        const switchAndGet = (lang) => {
            if (currentLang === lang) {
                return;
            }
            // 替换模板占位符
            let fileName = `README_${lang}.md`;
            const mapping = templateMapping[lang];
            // 找到所有的占位符进行替换
            containerElement.innerHTML = templateElement.innerHTML.replace(/{{\s*([A-Za-z0-9_\-]+)\s*}}/g, (match, p1) => {
                return mapping[p1] || match;
            });
            // 给语言切换按钮绑定事件
            const langItems = document.querySelectorAll('.lang-item');
            for (let langItem of langItems) {
                langItem.onclick = (e) => {
                    let lang = langItem.getAttribute('data-lang');
                    switchAndGet(lang);
                }
            }
            const markdownBody = document.querySelector(".markdown-body");
            if (localStorage.getItem(`somebottle-readme-${lang}`)) {
                markdownBody.innerHTML = localStorage.getItem(`somebottle-readme-${lang}`);
            }
            new Promise((resolve) => {
                if (readmeCache[lang]) {
                    resolve(readmeCache[lang]);
                } else {
                    fetch(`https://cdn.imbottle.com/about/${fileName}`, {
                        method: 'GET',
                        mode: 'cors',
                        credentials: 'omit'
                    }).then((resp) => resp.text())
                        .then((data) => {
                            readmeCache[lang] = data;
                            resolve(data);
                        })
                        .catch((err) => {
                            console.error(`Error fetching ${fileName}:`, err);
                            resolve(`## Error\n\nFailed to load the introduction file. Please refresh the page.`);
                        });
                }
            }).then((resp) => {
                let ready = window.markdownit({ html: true, linkify: true }).render(resp);
                document.querySelector(".markdown-body").innerHTML = ready;
                localStorage.setItem(`somebottle-readme-${lang}`, ready);
            });

            currentLang = lang;
            localStorage.setItem('somebottle-lang', lang);
            // 更新语言切换按钮状态
            for (let langItem of langItems) {
                if (langItem.getAttribute('data-lang') === lang) {
                    langItem.classList.add('lang-active');
                } else {
                    langItem.classList.remove('lang-active');
                }
            }
        };
        // 选中的语言
        let selectedLang = "zh";
        if (localStorage.getItem('somebottle-lang')) {
            selectedLang = localStorage.getItem('somebottle-lang');
        }
        switchAndGet(selectedLang);
    </script>
</body>
